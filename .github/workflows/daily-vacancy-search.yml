name: Daily Vacancy Search

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Search vacancies from multiple sources
        run: |
          python3 << 'EOF'
          import requests
          import json
          from datetime import datetime

          FIREBASE_URL = "https://job-tracker-new-cbbd4-default-rtdb.europe-west1.firebasedatabase.app"

          search_queries = [
              "it рекрутер",
              "junior it рекрутер",
              "IT ресечер",
              "it сорсер",
              "ит рекрутер",
              "ит сорсер",
              "менеджер по подбору персонала IT"
          ]

          all_vacancies = []

          # SuperJob
          for query in search_queries:
              try:
                  url = "https://api.superjob.ru/0.0/vacancies/"
                  params = {
                      "keyword": query,
                      "geo[c][0]": "4",
                      "geo[c][1]": "31",
                      "count": 50
                  }
                  response = requests.get(url, params=params, headers={"User-Agent": "Mozilla/5.0"}, timeout=5)
                  if response.status_code == 200:
                      data = response.json()
                      for item in data.get("objects", []):
                          all_vacancies.append({
                              "id": f"superjob_{item['id']}",
                              "title": item["profession"],
                              "company": item["company_name"],
                              "url": item["link"],
                              "salary": item.get("payment_from", "не указана"),
                              "source": "SuperJob"
                          })
                      print(f"SuperJob: Found {len(data.get('objects', []))} for '{query}'")
              except Exception as e:
                  print(f"SuperJob error: {e}")

          # Habr Career
          for query in search_queries:
              try:
                  url = "https://career.habr.com/api/v1/vacancies"
                  params = {
                      "text": query,
                      "limit": 50
                  }
                  response = requests.get(url, params=params, headers={"User-Agent": "Mozilla/5.0"}, timeout=5)
                  if response.status_code == 200:
                      data = response.json()
                      for item in data.get("items", []):
                          all_vacancies.append({
                              "id": f"habr_{item['id']}",
                              "title": item["title"],
                              "company": item["company"]["title"],
                              "url": f"https://career.habr.com/vacancies/{item['id']}",
                              "salary": item.get("salary_from", "не указана"),
                              "source": "Habr"
                          })
                      print(f"Habr: Found {len(data.get('items', []))} for '{query}'")
              except Exception as e:
                  print(f"Habr error: {e}")

          # Remove duplicates and limit to 15
          seen_ids = set()
          unique_vacancies = []
          for v in all_vacancies:
              if v["id"] not in seen_ids:
                  seen_ids.add(v["id"])
                  unique_vacancies.append(v)

          unique_vacancies = unique_vacancies[:15]

          # Upload to Firebase
          added_count = 0
          for vacancy in unique_vacancies:
              try:
                  job_data = {
                      "id": vacancy["id"],
                      "title": vacancy["title"],
                      "company": vacancy["company"],
                      "url": vacancy["url"],
                      "salary": str(vacancy.get("salary", "не указана")),
                      "tags": [vacancy["source"]],
                      "status": "new",
                      "fit": "high",
                      "letter": "",
                      "createdAt": int(datetime.now().timestamp() * 1000)
                  }

                  firebase_url = f"{FIREBASE_URL}/vacancies/{vacancy['id']}.json"
                  put_response = requests.put(firebase_url, json=job_data, timeout=10)

                  if put_response.status_code in [200, 201]:
                      added_count += 1
                      print(f"✓ Added: {vacancy['title']}")
              except Exception as e:
                  print(f"Error uploading: {e}")

          print(f"\n✅ Total added: {added_count} vacancies")

          EOF
