name: Daily Vacancy Cleanup

on:
  schedule:
    - cron: '5 17 * * *'  # 20:05 Moscow time (17:05 UTC, 5 minutes after search)
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove old and archived vacancies
        run: |
          python3 << 'EOF'
          import requests
          import json
          from datetime import datetime, timedelta

          FIREBASE_URL = "https://job-tracker-new-cbbd4-default-rtdb.europe-west1.firebasedatabase.app"
          THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000

          def check_vacancy_archived(vacancy_id):
              """Check if vacancy is still active on HH.ru"""
              try:
                  response = requests.get(
                      f"https://api.hh.ru/vacancies/{vacancy_id}",
                      headers={"User-Agent": "Mozilla/5.0"},
                      timeout=5
                  )
                  # If 404 or archived, it's gone
                  if response.status_code in [404, 410]:
                      return True
                  if response.status_code == 200:
                      # Check if vacancy has archived flag
                      data = response.json()
                      return data.get("archived", False)
                  return False
              except Exception as e:
                  print(f"Error checking vacancy {vacancy_id}: {e}")
                  return False

          # Fetch all vacancies from Firebase
          try:
              response = requests.get(f"{FIREBASE_URL}/vacancies.json")
              if response.status_code != 200:
                  print(f"Error fetching vacancies: {response.status_code}")
                  exit(1)

              vacancies = response.json() or {}
              print(f"Checking {len(vacancies)} vacancies...")

              current_time_ms = int(datetime.now().timestamp() * 1000)
              removed_count = 0

              for vacancy_id, vacancy_data in vacancies.items():
                  try:
                      # Check age
                      created_at = vacancy_data.get("createdAt", current_time_ms)
                      age_ms = current_time_ms - created_at
                      is_too_old = age_ms > THIRTY_DAYS_MS

                      # Check if archived on HH.ru
                      is_archived = check_vacancy_archived(vacancy_id)

                      if is_too_old or is_archived:
                          # Delete from Firebase
                          delete_url = f"{FIREBASE_URL}/vacancies/{vacancy_id}.json"
                          delete_response = requests.delete(delete_url)

                          if delete_response.status_code in [200, 204]:
                              removed_count += 1
                              reason = "too old" if is_too_old else "archived"
                              print(f"✓ Removed: {vacancy_data.get('title', vacancy_id)} ({reason})")
                          else:
                              print(f"✗ Failed to remove: {vacancy_id}")

                  except Exception as e:
                      print(f"Error processing vacancy {vacancy_id}: {e}")

              print(f"\n✅ Total removed: {removed_count} vacancies")

          except Exception as e:
              print(f"Fatal error: {e}")
              exit(1)

          EOF
